# FlucidOS System Bootstrap
# BuildStream project configuration

name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  pkgsrc: https://github.com/flucidOS/pkg-src/releases/download/
  gitlab: https://gitlab.com/

variables:
  prefix: /tools
  bindir: "%{prefix}/bin"
  sbindir: "%{prefix}/sbin"
  libdir: "%{prefix}/lib"
  includedir: "%{prefix}/include"
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  datadir: "%{prefix}/share"

  bootstrap-triplet: x86_64-pc-linux-gnu
  bootstrap-sysroot: /sysroot
  strip-binaries: ""

elements:
  autotools:
    variables:
      # Bypass autoreconf completely. The lookaside tarballs are pre-bootstrapped.
      autogen: 'true'
      
      # Dummy out documentation and regeneration tools. 
      # Git checkouts packed into tarballs have identical timestamps, which tricks 
      # Makefiles into trying to rebuild docs/headers with tools that aren't in the sandbox.
      make-args: >-
        MAKEINFO=true
        HELP2MAN=true
        GPERF=true
        ACLOCAL=true
        AUTOCONF=true
        AUTOMAKE=true
        AUTOHEADER=true
        
      # Standardize out-of-tree builds for all GNU tools
      build-dir: build
      conf-root: "%{build-root}"
      conf-cmd: "%{conf-root}/configure"
      conf-args: >-
        --prefix=%{prefix}
        --libdir=%{libdir}
        --disable-nls
        
      # Ensure configure is executable, then run it cleanly
      configure: |
        chmod +x "%{conf-cmd}" || true
        mkdir -p "%{build-dir}"
        cd "%{build-dir}"
        %{conf-cmd} %{conf-args}
        
      # Pass the dummy overrides to both make and make install
      make: make -C "%{build-dir}" -j%{max-jobs} %{make-args}
      make-install: make -C "%{build-dir}" -j1 DESTDIR="%{install-root}" %{make-args} %{make-install-args} install
      remove-libtool-modules: true

  make:
    variables:
      make: make -j%{max-jobs}
      make-install: make -j1 DESTDIR="%{install-root}" install

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
