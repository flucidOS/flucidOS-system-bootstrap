# FlucidOS System Bootstrap
# BuildStream project configuration

name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  pkgsrc: https://github.com/flucidOS/pkg-src/releases/download/
  gitlab: https://gitlab.com/

variables:
  prefix: /tools
  bindir: "%{prefix}/bin"
  sbindir: "%{prefix}/sbin"
  libdir: "%{prefix}/lib"
  includedir: "%{prefix}/include"
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  datadir: "%{prefix}/share"

  bootstrap-triplet: x86_64-pc-linux-gnu
  bootstrap-sysroot: /sysroot
  strip-binaries: ""

elements:
  autotools:
    variables:
      autogen: |
        chmod -R a+x "%{conf-root}" || true
      build-dir: build
      conf-root: "%{build-root}"
      conf-cmd: "%{conf-root}/configure"
      conf-args: >-
        --prefix=%{prefix}
        --libdir=%{libdir}
        --disable-nls
      make-args: >-
        MAKEINFO=true
        HELP2MAN=true
      configure: |
        # Dynamically resolve the absolute path to grep to prevent infinite wrapper loops
        REAL_GREP=$(command -v grep)
        mkdir -p "%{build-root}/.bin"
        echo '#!/bin/sh' > "%{build-root}/.bin/grep"
        echo "exec $REAL_GREP \"\$@\" 2>/dev/null" >> "%{build-root}/.bin/grep"
        chmod +x "%{build-root}/.bin/grep"
        export PATH="%{build-root}/.bin:$PATH"

        mkdir -p "%{build-dir}"
        cd "%{build-dir}"
        %{conf-cmd} %{conf-args}
      make: make -C "%{build-dir}" -j%{max-jobs} %{make-args}
      make-install: make -C "%{build-dir}" -j1 %{make-args} %{make-install-args}
      remove-libtool-modules: true

  make:
    variables:
      make: make -j%{max-jobs}
      make-install: make -j1 install

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
