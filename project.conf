name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  github: https://github.com/
  gitlab: https://gitlab.com/
  kernel: https://git.kernel.org/pub/scm/
  gnu-ftp: https://ftpmirror.gnu.org/gnu/
  sourceware: https://sourceware.org/git/
  kitware: https://gitlab.kitware.com/
  tukaani: https://git.tukaani.org/
  pypi: https://files.pythonhosted.org/packages/

variables:
  prefix: /tools
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  sbindir: "%{bindir}"

  bootstrap-triplet: x86_64-flucidOS-linux-gnu
  bootstrap-sysroot: /sysroot

  strip-binaries: ""

elements:
  autotools:
    variables:
      build-dir: "."
      conf-root: "%{build-root}"
      configure: mkdir -p "%{build-dir}"; cd "%{build-dir}" && %{conf-cmd} %{conf-args}
      make: make -C "%{build-dir}" %{make-args}
      make-install: make -C "%{build-dir}" -j1 %{make-install-args}
      remove-libtool-modules: true
      remove-libtool-libraries: true

sources:
  git:
    config:
      track: master

environment:
  TERM: xterm-256color
  PATH: "%{bindir}:/usr/bin"
  PYTHONHASHSEED: 0

shell:
  command: ["bash", "--noprofile", "--norc", "-i"]
  host-files:
  - /sys
  - /etc/passwd
  - /etc/group
  - /etc/resolv.conf

# EXACT CARBONOS PLUGIN CONFIGURATION (No circular junctions)
plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - autotools
  - cmake
  - make
  sources:
  - git
  - patch

junctions:
  internal:
  - freedesktop-sdk.bst
