# FlucidOS System Bootstrap
name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  pkgsrc: https://github.com/flucidOS/pkg-src/releases/download/
  gitlab: https://gitlab.com/

variables:
  prefix: /tools
  bindir: "%{prefix}/bin"
  sbindir: "%{prefix}/sbin"
  libdir: "%{prefix}/lib"
  includedir: "%{prefix}/include"
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  datadir: "%{prefix}/share"

  bootstrap-triplet: x86_64-pc-linux-gnu
  bootstrap-sysroot: /sysroot
  strip-binaries: ""
  
  # Default empty conf-local so elements don't crash if they omit it
  conf-local: ""

elements:
  autotools:
    variables:
      # Bypass autoreconf explicitly; our lookaside cache is already generated
      autogen: 'true'
      build-dir: build
      conf-root: "%{build-root}"
      conf-cmd: "%{conf-root}/configure"
      
      # Core BuildStream structure for appending flags
      conf-args: >-
        --prefix=%{prefix}
        --libdir=%{libdir}
        --disable-nls
        %{conf-local}
        
      # Globally dummy-out documentation and code-generation tools
      make-args: >-
        MAKEINFO=true
        HELP2MAN=true
        GPERF=true
        ACLOCAL=true
        AUTOCONF=true
        AUTOMAKE=true
        AUTOHEADER=true
        
      configure: |
        chmod +x "%{conf-cmd}" || true
        mkdir -p "%{build-dir}"
        cd "%{build-dir}"
        %{conf-cmd} %{conf-args}
        
      # Pass dummy overrides safely to the Make environment
      make: make -C "%{build-dir}" -j%{max-jobs} %{make-args}
      make-install: make -C "%{build-dir}" -j1 DESTDIR="%{install-root}" %{make-args} %{make-install-args} install
      remove-libtool-modules: true

  make:
    variables:
      make: make -j%{max-jobs}
      make-install: make -j1 DESTDIR="%{install-root}" install

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
