# FlucidOS System Bootstrap
name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  pkgsrc: https://github.com/flucidOS/pkg-src/releases/download/
  gitlab: https://gitlab.com/

variables:
  prefix: /tools
  bindir: "%{prefix}/bin"
  sbindir: "%{prefix}/sbin"
  libdir: "%{prefix}/lib"
  includedir: "%{prefix}/include"
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  datadir: "%{prefix}/share"

  bootstrap-triplet: x86_64-pc-linux-gnu
  bootstrap-sysroot: /sysroot
  strip-binaries: ""
  
  conf-local: ""

elements:
  autotools:
    variables:
      autogen: 'true'
      build-dir: build
      conf-root: "%{build-root}"
      conf-cmd: "%{conf-root}/configure"
      
      conf-args: >-
        --prefix=%{prefix}
        --libdir=%{libdir}
        --disable-nls
        %{conf-local}
        
      make-args: >-
        MAKEINFO=true
        HELP2MAN=true
        ACLOCAL=true
        AUTOCONF=true
        AUTOMAKE=true
        AUTOHEADER=true
        
      configure: |
        # 1. BRUTE FORCE PERMISSIONS: Fix ALL nested scripts stripped by tarball creation
        chmod -R a+x "%{conf-root}" || true
        
        # 2. BRUTE FORCE GREP: Silence warnings without infinite loops
        mkdir -p "%{build-root}/.bin"
        cat << 'WRAPPER' > "%{build-root}/.bin/grep"
        #!/bin/sh
        exec /usr/bin/grep "$@" 2>/dev/null
        WRAPPER
        chmod +x "%{build-root}/.bin/grep"
        export PATH="%{build-root}/.bin:$PATH"
        
        # 3. BRUTE FORCE TIMESTAMPS: Push inputs to year 2000, docs to 2030
        find "%{conf-root}" -type f -name "*.gperf" -exec touch -m -a -t 200001010000 {} + || true
        find "%{conf-root}" -type f \( -name "*.info" -o -name "*.1" -o -name "*.man" \) -exec touch -m -a -t 203012312359 {} + || true

        mkdir -p "%{build-dir}"
        cd "%{build-dir}"
        %{conf-cmd} %{conf-args}
        
      make: make -C "%{build-dir}" -j%{max-jobs} %{make-args}
      make-install: make -C "%{build-dir}" -j1 DESTDIR="%{install-root}" %{make-args} %{make-install-args} install
      remove-libtool-modules: true

  make:
    variables:
      make: make -j%{max-jobs}
      make-install: make -j1 DESTDIR="%{install-root}" install

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
