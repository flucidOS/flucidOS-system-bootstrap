# FlucidOS System Bootstrap
# BuildStream project configuration

name: flucidOS-bootstrap
min-version: 2.0
element-path: elements
ref-storage: project.refs

fatal-warnings:
- overlaps
- ref-not-in-track
- unaliased-url

aliases:
  pkgsrc: https://github.com/flucidOS/pkg-src/releases/download/
  gitlab: https://gitlab.com/

variables:
  prefix: /tools
  bindir: "%{prefix}/bin"
  sbindir: "%{prefix}/sbin"
  libdir: "%{prefix}/lib"
  includedir: "%{prefix}/include"
  sysconfdir: "%{prefix}/etc"
  localstatedir: "%{prefix}/var"
  datadir: "%{prefix}/share"

  bootstrap-triplet: x86_64-pc-linux-gnu
  bootstrap-sysroot: /sysroot
  strip-binaries: ""

elements:
  autotools:
    variables:
      autogen: |
        # Safely restore execution bits on configure and build scripts
        find "%{conf-root}" -type f \( -name "configure" -o -name "*.sh" -o -name "config.guess" -o -name "config.sub" -o -name "compile" -o -name "install-sh" -o -name "missing" -o -name "depcomp" -o -name "test-driver" \) -exec chmod +x {} + || true
        # Prevent doc rebuilds by bumping timestamps into the year 2030
        find "%{conf-root}" -type f \( -name "*.info" -o -name "*.1" -o -name "*.man" -o -name "*.texi" -o -name "*.texinfo" \) -exec touch -m -a -t 203012312359 {} + || true
      build-dir: build
      conf-root: "%{build-root}"
      conf-cmd: "%{conf-root}/configure"
      conf-args: >-
        --prefix=%{prefix}
        --libdir=%{libdir}
        --disable-nls
      configure: |
        # Wrap grep to silently drop "stray \" warnings that poison stderr compiler tests
        mkdir -p .bin
        echo '#!/bin/sh' > .bin/grep
        echo 'exec command grep "$@" 2>/dev/null' >> .bin/grep
        chmod +x .bin/grep
        export PATH="$(pwd)/.bin:$PATH"

        mkdir -p "%{build-dir}"
        cd "%{build-dir}"
        %{conf-cmd} %{conf-args}
      make: make -C "%{build-dir}" -j%{max-jobs} %{make-args}
      make-install: make -C "%{build-dir}" -j1 %{make-install-args}
      remove-libtool-modules: true

  make:
    variables:
      make: make -j%{max-jobs}
      make-install: make -j1 install

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
