name: flucidos-bootstrap
min-version: 2.0

element-path: elements

aliases:
  fdo: https://gitlab.com/freedesktop-sdk/
  gnu: https://mirrors.kernel.org/gnu/
  github: https://github.com/

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
  - origin: local
    path: plugins
    elements:
      - gnu

variables:
  target_arch: "x86_64"
  flucidos-target: "%{target_arch}-flucidos-linux-gnu"
  sysroot: "/sysroot"
  tools: "/tools"
