name: Bootstrap flucidOS Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-bootstrap:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Fix Bubblewrap Permissions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure BuildStream & Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv bubblewrap git tar zstd curl
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "buildstream==2.8.0" "dulwich<0.22.0"
          
          mkdir -p ~/.config
          cat <<EOF > ~/.config/buildstream.conf
          cachedir: ${HOME}/bst-cache
          cache:
            quota: infinity
            pull-buildtrees: False
            cache-buildtrees: never
          EOF

      - name: Install ORAS & Login
        run: |
          curl -LO "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz"
          mkdir -p oras-install
          tar -zxf oras_1.2.0_linux_amd64.tar.gz -C oras-install
          sudo mv oras-install/oras /usr/local/bin/
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute cache coordinates
        id: cache-vars
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SAFE_TAG=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9._-' '-')
          echo "repo=ghcr.io/${REPO_LOWER}/bst-cache" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Restore BuildStream caches
        env:
          GHCR_CACHE_REPO: ${{ steps.cache-vars.outputs.repo }}
          CACHE_TAG: ${{ steps.cache-vars.outputs.tag }}
        run: |
          ./scripts/bst-cache.sh restore sources
          ./scripts/bst-cache.sh restore cas

      - name: Track & build adjusted.bst
        run: |
          .venv/bin/bst source track adjusted.bst
          .venv/bin/bst build adjusted.bst

      - name: Run toolchain smoke test
        run: .venv/bin/bst build tools/test.bst

      - name: Check out result
        run: |
          rm -rf result
          .venv/bin/bst --no-strict artifact checkout -d none --no-integrate adjusted.bst --directory result/

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: flucidOS-bootstrap-result
          path: result/

      - name: Save BuildStream caches
        if: always()
        env:
          GHCR_CACHE_REPO: ${{ steps.cache-vars.outputs.repo }}
          CACHE_TAG: ${{ steps.cache-vars.outputs.tag }}
        run: |
          ./scripts/bst-cache.sh save sources
          ./scripts/bst-cache.sh save cas
