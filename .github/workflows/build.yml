name: FlucidOS Toolchain Bootstrap

on:
  push:
    branches: [ "main" ]
  # Allows you to trigger the build manually from the GitHub UI
  workflow_dispatch: 

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          echo "Removing unnecessary GitHub Runner tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Bypass Ubuntu 24.04 AppArmor Restrictions
        run: |
          echo "Disabling AppArmor unprivileged user namespace restrictions for bwrap..."
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lzip bubblewrap
          # Use pipx to bypass PEP-668 strict environment rules on Ubuntu runners
          pipx install BuildStream
          pipx inject BuildStream dulwich requests buildstream-plugins

      - name: Compile the Toolchain
        run: |
          # This compiles GCC, Glibc, and core utilities into /tools
          # It relies strictly on the project.refs hashes you just pushed
          bst build all.bst

      - name: Export the Rootfs
        run: |
          echo "Extracting the compiled /tools directory..."
          bst artifact checkout all.bst --directory ./bootstrap-root

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push OCI Image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/flucidos-bootstrap:latest
          # Convert the repository owner string to lowercase (Docker requirement)
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          echo "Packaging /tools into a scratch OCI image..."
          tar -cC ./bootstrap-root . | docker import - $IMAGE_ID
          
          echo "Pushing $IMAGE_ID to GHCR..."
          docker push $IMAGE_ID
