name: FlucidOS Toolchain Bootstrap

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          echo "Removing unnecessary GitHub Runner tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Configure Ubuntu 24.04 AppArmor for Bubblewrap
        run: |
          echo "Installing and loading the official bwrap AppArmor profile..."
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y lzip
          pipx install BuildStream
          pipx inject BuildStream dulwich requests buildstream-plugins

      - name: Compile the Toolchain
        run: |
          bst build all.bst

      - name: Export the Rootfs
        run: |
          bst artifact checkout all.bst --directory ./bootstrap-root

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push OCI Image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/flucidos-bootstrap:latest
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          tar -cC ./bootstrap-root . | docker import - $IMAGE_ID
          docker push $IMAGE_ID
