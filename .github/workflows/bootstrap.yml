name: FlucidOS System Bootstrap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-bootstrap:
    runs-on: ubuntu-24.04   # pinned explicitly — don't ride "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1

      - name: install sandboxing deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap just

      # BuildStream's sandbox is bubblewrap. Ubuntu 24.04's AppArmor policy
      # blocks unprivileged user namespaces by default — without this you
      # hit "bwrap: setting up uid map: Permission denied".
      - name: allow unprivileged userns for bwrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0

      # GitHub Actions runners have network restrictions that can timeout
      # direct git fetches to external repos. Relax git's timeouts and add
      # DNS retry logic so transient network hiccups don't kill the build.
      - name: configure git for network resilience
        run: |
          git config --global http.connectTimeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          git config --global core.compression 0

      # buildstream and buildstream-plugins MUST land in the same
      # environment `bst` actually runs from. pipx would isolate
      # buildstream in its own venv and buildstream-plugins would never
      # reach it — bst then fails to load the autotools/make plugins
      # project.conf declares, and plugins/gnu.py (which subclasses
      # buildstream_plugins.elements.autotools) fails to import. A plain
      # venv here keeps both packages together, and avoids the
      # pip-install-as-root/PEP-668 mess build.yml was fighting.
      - name: install buildstream + plugins
        run: |
          python3 -m venv "$HOME/.bst-venv"
          "$HOME/.bst-venv/bin/pip" install --upgrade pip
          "$HOME/.bst-venv/bin/pip" install buildstream buildstream-plugins
          echo "$HOME/.bst-venv/bin" >> "$GITHUB_PATH"

      # Cache BuildStream's source directory — once freedesktop-sdk.git is
      # fetched and cached here, subsequent runs never re-fetch it unless
      # project.refs changes. Saves ~30s of network time per run.
      - name: restore buildstream sources cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream/sources
          key: bst-sources-${{ hashFiles('project.refs', 'elements/freedesktop-sdk.bst') }}
          restore-keys: |
            bst-sources-

      # GHCR snapshot cache for the full BuildStream artifact cache (tar + zstd).
      # If available, pulls and restores; if not, build continues and we push
      # after. Saves rebuilding unchanged elements on second and later runs.
      - name: restore buildstream artifact cache from GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Attempting to restore cache from ghcr.io/$OWNER/flucidos-bootstrap-cache:latest"
          if oras pull "ghcr.io/$OWNER/flucidos-bootstrap-cache:latest" \
            -o /tmp/bst-cache-restore 2>/dev/null; then
            if [ -f /tmp/bst-cache-restore/cache.tar.zst ]; then
              mkdir -p ~/.cache/buildstream
              zstd -d /tmp/bst-cache-restore/cache.tar.zst -c | tar -C ~/.cache/buildstream -xf - || true
              echo "Cache restored successfully"
            fi
          else
            echo "Cache not found or inaccessible, proceeding with fresh build"
          fi

      # Pre-fetch the FDO junction explicitly before the main build.
      # This lets network issues surface early and be retried independently
      # of the full build. Also populates ~/.cache/buildstream/sources.
      - name: pre-fetch freedesktop-sdk junction
        run: |
          echo "Pre-fetching FDO junction to catch network issues early..."
          bst source fetch elements/freedesktop-sdk.bst --deps all || true
          echo "FDO junction fetch complete (or cached)"

      - name: build bootstrap toolchain
        run: just build

      - name: checkout bootstrap rootfs
        run: bst artifact checkout all.bst --directory ./bootstrap-root

      - name: authenticate with GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push bootstrap rootfs
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/flucidos-bootstrap:latest" | tr '[:upper:]' '[:lower:]')
          tar -cC ./bootstrap-root . | docker import - "$IMAGE_ID"
          docker push "$IMAGE_ID"

      - name: snapshot buildstream cache to GHCR
        if: github.event_name != 'pull_request' && success()
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Compressing BuildStream cache (~10-30s)..."
          tar -C ~/.cache/buildstream -cf - . 2>/dev/null | zstd -T0 -o /tmp/cache.tar.zst || true
          
          if [ -f /tmp/cache.tar.zst ] && [ -s /tmp/cache.tar.zst ]; then
            echo "Pushing cache to ghcr.io/$OWNER/flucidos-bootstrap-cache:latest..."
            echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            oras push "ghcr.io/$OWNER/flucidos-bootstrap-cache:latest" \
              /tmp/cache.tar.zst:application/octet-stream || true
            echo "Cache push complete"
          else
            echo "Cache file empty or missing, skipping push"
          fi
