name: FlucidOS System Bootstrap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install sandboxing deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap just zstd lzip

      - name: allow unprivileged userns for bwrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0

      - name: install buildstream + plugins
        run: |
          python3 -m venv "$HOME/.bst-venv"
          "$HOME/.bst-venv/bin/pip" install --upgrade pip
          "$HOME/.bst-venv/bin/pip" install dulwich requests buildstream buildstream-plugins
          echo "$HOME/.bst-venv/bin" >> "$GITHUB_PATH"

      - uses: oras-project/setup-oras@v1

      - name: restore buildstream cache from GHCR (if available)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p /tmp/cache-restore
          echo "Attempting to restore cache from ghcr.io/$OWNER/flucidos-bootstrap-cache:latest"
          oras pull "ghcr.io/$OWNER/flucidos-bootstrap-cache:latest" \
            -o /tmp/cache-restore 2>/dev/null || echo "Cache not found or inaccessible, proceeding with fresh build"
          if [ -f /tmp/cache-restore/cache.tar.zst ]; then
            echo "Cache found, extracting..."
            mkdir -p ~/.cache/buildstream
            zstd -d /tmp/cache-restore/cache.tar.zst -c | tar -C ~/.cache/buildstream -xf -
            echo "Cache restored successfully"
          else
            echo "No cache file found, starting fresh build"
          fi

      - name: build bootstrap toolchain (with network retries)
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"
            just build
            result=$?
            if [ $result -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Build failed on attempt $attempt, waiting 60 seconds before retry..."
              sleep 60
            fi
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: snapshot buildstream cache to GHCR
        if: success()
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p /tmp/cache-snapshot
          echo "Creating cache snapshot..."
          tar -C ~/.cache/buildstream -cf - . | zstd -T0 -o /tmp/cache-snapshot/cache.tar.zst
          echo "Uploading cache to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push "ghcr.io/$OWNER/flucidos-bootstrap-cache:latest" \
            /tmp/cache-snapshot/cache.tar.zst:application/octet-stream --disable-path-validation
          echo "Cache uploaded successfully"

      - name: checkout bootstrap rootfs
        run: bst artifact checkout all.bst --directory ./bootstrap-root

      - name: authenticate with GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push bootstrap rootfs
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/flucidos-bootstrap:latest" | tr '[:upper:]' '[:lower:]')
          tar -cC ./bootstrap-root . | docker import - "$IMAGE_ID"
          docker push "$IMAGE_ID"
