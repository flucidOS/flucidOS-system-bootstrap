name: Bootstrap build

# Builds the flucidOS bootstrap toolchain with BuildStream, entirely on
# GitHub-hosted runners. Persistent caching of BuildStream's local `sources`
# and `cas` (build) caches is done via GHCR + ORAS -- see scripts/bst-cache.sh
# and the "Persistent caching" section of the README for details. There is
# no BuildStream artifact-cache server involved: GHCR is the cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # required to push/pull the cache snapshots on GHCR

env:
  BST_IMAGE: docker.io/buildstream/buildstream:latest
  ORAS_VERSION: "1.2.2"

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # BuildStream is bootstrapping a full cross-toolchain here (two passes
      # of gcc, glibc, binutils, gdb, python, perl, ...), plus source/build
      # caches. GitHub-hosted runners only guarantee ~14GB free by default,
      # which preinstalled tool caches (.NET, Android SDK, GHC, ...) eat into.
      # None of that is used by this build, so clear it out first.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          df -h /

      - name: Install oras and zstd
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          oras version

      - name: Compute cache coordinates
        id: cache
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${repo_lc}/bst-cache" >> "$GITHUB_OUTPUT"

          ref="${{ github.head_ref || github.ref_name }}"
          safe_ref="$(echo "$ref" | tr -c 'a-zA-Z0-9._-' '-' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${safe_ref}" >> "$GITHUB_OUTPUT"
          echo "fallback=main" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Restore BuildStream caches
        env:
          GHCR_CACHE_REPO: ${{ steps.cache.outputs.repo }}
          CACHE_TAG: ${{ steps.cache.outputs.tag }}
          FALLBACK_TAG: ${{ steps.cache.outputs.fallback }}
        run: |
          mkdir -p "$HOME/bst-cache"
          ./scripts/bst-cache.sh restore sources
          ./scripts/bst-cache.sh restore cas

      - name: Pull BuildStream builder image
        run: docker pull "$BST_IMAGE"

      # BuildStream sandboxes every build command in a nested bubblewrap
      # container. On recent Ubuntu runner images that requires either
      # --privileged or a permissive AppArmor profile for unprivileged user
      # namespaces -- --privileged is the simplest option on ephemeral,
      # GitHub-hosted runners.
      - name: Build adjusted.bst and run toolchain smoke test
        run: |
          docker run --rm --privileged \
            -v "$PWD":/srv/flucidos-bootstrap \
            -v "$HOME/bst-cache":/root/.cache/buildstream \
            -w /srv/flucidos-bootstrap \
            "$BST_IMAGE" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              bst --colors --no-interactive build adjusted.bst
              bst --colors --no-interactive build tools/test.bst
            '

      - name: Save BuildStream caches
        if: always()
        env:
          GHCR_CACHE_REPO: ${{ steps.cache.outputs.repo }}
          CACHE_TAG: ${{ steps.cache.outputs.tag }}
        run: |
          ./scripts/bst-cache.sh save sources
          ./scripts/bst-cache.sh save cas

      - name: Check out built bootstrap
        if: success()
        run: |
          rm -rf result
          docker run --rm --privileged \
            -v "$PWD":/srv/flucidos-bootstrap \
            -v "$HOME/bst-cache":/root/.cache/buildstream \
            -w /srv/flucidos-bootstrap \
            "$BST_IMAGE" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              bst --no-strict artifact checkout -d none --no-integrate \
                adjusted.bst --directory result/
            '

      - name: Upload bootstrap artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flucidos-bootstrap-${{ github.sha }}
          path: result/
          retention-days: 14
