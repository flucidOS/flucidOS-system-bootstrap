version: 2.1

jobs:
  build-os-bootstrap:
    machine:
      image: ubuntu-2204:current
    # The free tier 'medium' machine provides 4 vCPUs and 8GB RAM
    resource_class: medium 
    steps:
      - checkout

      - run:
          name: Create Emergency Swap Space
          command: |
            sudo fallocate -l 10G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl vm.swappiness=10

      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-pip python3-venv bubblewrap git tar zstd curl
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install "buildstream==2.8.0" "dulwich<0.22.0"

      - run:
          name: Configure BuildStream (Throttled for RAM)
          command: |
            mkdir -p ~/.config
            cat <<EOF > ~/.config/buildstream.conf
            cachedir: ${HOME}/bst-cache
            build:
              max-jobs: 2
              builders: 2
            cache:
              quota: infinity
              pull-buildtrees: False
              cache-buildtrees: never
            EOF

      - run:
          name: Build flucidOS Bootstrap
          # CircleCI allows SSH debugging if a job fails, which is great for BuildStream
          command: |
            .venv/bin/bst source track adjusted.bst
            .venv/bin/bst build adjusted.bst
            .venv/bin/bst build tools/test.bst

      - run:
          name: Checkout Artifacts
          command: |
            rm -rf result
            .venv/bin/bst --no-strict artifact checkout -d none --no-integrate adjusted.bst --directory result/

      - store_artifacts:
          path: result/
          destination: flucidOS-bootstrap-result

workflows:
  version: 2
  build-workflow:
    jobs:
      - build-os-bootstrap
