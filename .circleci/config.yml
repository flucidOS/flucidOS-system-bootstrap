version: 2.1

parameters:
  auto_retry_count:
    type: integer
    default: 0

jobs:
  build-os:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      GHCR_CACHE_REPO: ghcr.io/flucidos/flucidos-system-bootstrap/bst-cache
      FALLBACK_TAG: main
      BST_BUILD_MINUTES: "46"
      AUTO_RETRY_MAX: "15"
    steps:
      - checkout
      - run:
          name: Create Emergency Swap Space
          command: |
            sudo fallocate -l 10G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl vm.swappiness=10
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y python3-pip python3-venv bubblewrap git tar zstd curl lzip
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install "buildstream==2.8.0" "dulwich<0.22.0" requests
      - run:
          name: Configure BuildStream (Throttled for RAM)
          command: |
            mkdir -p ~/.config
            printf '%s\n' \
              "cachedir: ${HOME}/bst-cache" \
              "sourcedir: ${HOME}/bst-cache/sources" \
              "build:" \
              "  max-jobs: 4" \
              "scheduler:" \
              "  builders: 2" \
              "cache:" \
              "  quota: infinity" \
              "  pull-buildtrees: False" \
              "  cache-buildtrees: never" \
              > ~/.config/buildstream.conf
      - run:
          name: Install ORAS and log in to GHCR
          command: |
            : "${GHCR_USER:?set GHCR_USER in CircleCI project env vars}"
            : "${GHCR_TOKEN:?set GHCR_TOKEN in CircleCI project env vars}"
            curl -fsSL -o oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
            mkdir -p oras-install
            tar -zxf oras.tar.gz -C oras-install
            sudo mv oras-install/oras /usr/local/bin/
            echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin
            printf 'export CACHE_TAG=%s\n' "$(printf '%s' "$CIRCLE_BRANCH" | tr -c 'a-zA-Z0-9._-' '-')" >> "$BASH_ENV"
      - run:
          name: Restore BuildStream caches
          no_output_timeout: 30m
          command: |
            ./scripts/bst-cache.sh restore sources
            ./scripts/bst-cache.sh restore cas
            ./scripts/bst-cache.sh restore artifacts
      - run:
          name: Build flucidOS
          no_output_timeout: 60m
          command: |
            .venv/bin/bst source track adjusted.bst
            timeout -k 120 "${BST_BUILD_MINUTES}m" bash -c '.venv/bin/bst build adjusted.bst && .venv/bin/bst build tools/test.bst'
      - run:
          name: Save BuildStream caches
          when: always
          no_output_timeout: 30m
          command: |
            sleep 5
            ./scripts/bst-cache.sh save sources
            ./scripts/bst-cache.sh save cas
            ./scripts/bst-cache.sh save artifacts
      - run:
          name: Check completion; auto-rerun if not finished, else checkout
          no_output_timeout: 10m
          command: |
            mkdir -p result
            missing="$(.venv/bin/bst show --deps all -f '%{state} %{name}' adjusted.bst tools/test.bst 2>/dev/null | grep -v '^cached' || true)"

            if [ -n "$missing" ]; then
              echo "Not finished yet -- still missing:"
              echo "$missing"

              RETRY_COUNT=<< pipeline.parameters.auto_retry_count >>
              if [ "$RETRY_COUNT" -ge "$AUTO_RETRY_MAX" ]; then
                echo "Hit auto-retry cap (${AUTO_RETRY_MAX}) -- stopping here."
                echo "Check in and click Rerun manually once you've looked at why it's not converging."
                exit 1
              fi

              : "${CIRCLE_TOKEN:?set CIRCLE_TOKEN (a personal API token) in CircleCI project env vars}"
              : "${CIRCLE_PIPELINE_DEFINITION_ID:?set CIRCLE_PIPELINE_DEFINITION_ID in CircleCI project env vars -- Project Settings -> Pipelines}"

              NEXT_COUNT=$((RETRY_COUNT + 1))
              echo "Triggering continuation run (attempt ${NEXT_COUNT}/${AUTO_RETRY_MAX})..."
              curl -fsS -X POST \
                "https://circleci.com/api/v2/project/circleci/${CIRCLE_ORGANIZATION_ID}/${CIRCLE_PROJECT_ID}/pipeline/run" \
                -H "Circle-Token: ${CIRCLE_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"definition_id\": \"${CIRCLE_PIPELINE_DEFINITION_ID}\", \"config\": {\"branch\": \"${CIRCLE_BRANCH}\"}, \"parameters\": {\"auto_retry_count\": ${NEXT_COUNT}}}"
              echo
              echo "Triggered. This job's work is done for now; the new pipeline continues from the cache just saved."
              exit 0
            fi

            echo "Build complete -- nothing missing. Checking out artifacts."
            rm -rf result
            .venv/bin/bst --no-strict artifact checkout -d none --no-integrate adjusted.bst --directory result/
      - store_artifacts:
          path: result/
          destination: flucidOS-bootstrap-result

workflows:
  version: 2
  build-workflow:
    jobs:
      - build-os:
          filters:
            branches:
              only: main
